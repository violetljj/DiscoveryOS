[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discoveryos"
version = "0.1.0"
description = "Evidence-first operating system for algorithm discovery"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "DiscoveryOS contributors"}]
dependencies = []

[project.scripts]
discoveryos = "discoveryos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
